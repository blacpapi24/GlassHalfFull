<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Half Full</title>
<meta name="description" content="Split it down the middle. A head to head halving duel for two phones.">
<meta name="theme-color" content="#111B31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glass Half Full">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: a dark modern cutting mat (Paddle Draft's navy chrome) with hand-inked cream stickers on it (Hugh's look).
   Each round puts one object on a cream chopping board in the middle of a single column. */
:root{
  --mat:#111B31; --surface:#172036; --surface2:#1D2842; --line:#2A3654;
  --text:#EEF1F8; --soft:#9AA6C2; --gold:#F2B84B; --gold-d:#B5832C;
  --cream:#FFF7E8; --pgrid:rgba(64,104,190,.10); --ink:#1B1A2E; --ink-soft:#615F7C;
  --p1:#FF7D6E; --p2:#56A6E2; --good:#3CC489; --bad:#FF6A6F; --half:#E8A21A; --blush:#FF8FA3;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --hand:"Gaegu","Chalkboard SE","Comic Sans MS",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-color:var(--mat);
  background-image:radial-gradient(900px 520px at 50% -8%,rgba(242,184,75,.12),transparent 62%),
    linear-gradient(rgba(147,195,240,.085) 1px,transparent 1px),linear-gradient(90deg,rgba(147,195,240,.085) 1px,transparent 1px),
    linear-gradient(rgba(147,195,240,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(147,195,240,.04) 1px,transparent 1px);
  background-size:auto,120px 120px,120px 120px,24px 24px,24px 24px;background-attachment:fixed;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.online{padding-top:calc(56px + env(safe-area-inset-top,0px))}
#app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:clamp(30px,8vw,42px)}
h3{font-size:24px}
p{margin:0}
.muted{color:var(--soft)}
.center{text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.stack{display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.hint{font-size:15px;color:var(--soft)}
.sticker .hint,.sticker .muted{color:var(--ink-soft)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* hand-drawn sticker (Hugh) */
.sticker{background:var(--cream);color:var(--ink);border-radius:18px 22px 17px 24px/22px 17px 24px 18px;box-shadow:4px 5px 0 #070C1A;position:relative}
.ink::before{content:"";position:absolute;inset:0;border:2.5px solid var(--ink);border-radius:inherit;filter:url(#wobble);pointer-events:none;z-index:2}
/* modern surface (Paddle Draft) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}

.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--ink);background:var(--gold);
  border-radius:999px;padding:13px 26px 14px;box-shadow:0 5px 0 var(--gold-d),0 10px 22px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s,opacity .2s;position:relative}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d),0 4px 10px rgba(0,0,0,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:active{transform:translateY(2px)}
.sticker .btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 2.5px var(--ink)}
.btn.small{font-size:16px;padding:9px 16px 10px}
.link{appearance:none;background:none;border:0;font:inherit;color:var(--soft);text-decoration:underline;text-decoration-color:rgba(154,166,194,.5);text-underline-offset:5px;cursor:pointer;padding:6px}
.sticker .link{color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.p1{background:var(--p1);color:var(--ink);border-color:transparent}
.pill.p2{background:var(--p2);color:var(--ink);border-color:transparent}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:4px}
#heroGlass{width:150px;height:170px;cursor:pointer;touch-action:manipulation}
.logo{font-size:clamp(46px,14vw,74px);display:flex;flex-wrap:wrap;justify-content:center;gap:0 .22em;line-height:.95}
.logo .w{display:inline-block;animation:drop .7s cubic-bezier(.3,1.6,.5,1) both}
.logo .w:nth-child(2){animation-delay:.08s}.logo .w:nth-child(3){animation-delay:.16s}.logo .w:nth-child(4){animation-delay:.24s}
.logo .half{font-family:var(--hand);font-weight:700;letter-spacing:0;color:var(--ink);background:var(--gold);padding:0 .18em .06em;border-radius:14px 18px 13px 19px/18px 13px 19px 14px;transform:rotate(-5deg);box-shadow:3px 4px 0 #070C1A;position:relative}
.logo .half::before{content:"";position:absolute;inset:0;border:3px solid var(--ink);border-radius:inherit;filter:url(#wobble)}
@keyframes drop{from{opacity:0;transform:translateY(-36px) rotate(-10deg)}}
.tag{font-size:18px;color:var(--soft);max-width:30ch}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{appearance:none;font:inherit;text-align:left;cursor:pointer;padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;border:0;transition:transform .18s;
  transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.tile:nth-child(1){rotate:-1deg}.tile:nth-child(2){rotate:1deg}
.tile:active{scale:.97}
.tile canvas{width:100%;height:84px;display:block}
.tile h3{font-size:22px}
.tile p{font-size:14px;color:var(--ink-soft);line-height:1.3}
.note{padding:16px 18px;font-size:16px}
.note b{font-family:var(--hand);font-size:22px;display:block;margin-bottom:2px}
.online-box{display:flex;flex-direction:column;gap:12px}

/* setup */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;flex:1 1 200px;min-width:0}
input[type=text]{font:inherit;font-size:19px;color:var(--text);background:var(--mat);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-weight:800;font-size:32px;text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{appearance:none;font:inherit;font-size:15px;font-weight:500;color:var(--text);background:var(--surface2);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.err{color:var(--bad);font-size:15px;min-height:1.2em}
.roomcode{display:flex;gap:8px;justify-content:center}
.roomcode span{font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,68px);width:1.1em;height:1.25em;display:grid;place-items:center;background:var(--cream);color:var(--ink);border-radius:14px 18px 13px 19px/18px 13px 19px 14px;box-shadow:3px 4px 0 #070C1A;position:relative}
.roomcode span::before{content:"";position:absolute;inset:0;border:3px solid var(--ink);border-radius:inherit;filter:url(#wobble)}
.roomcode span:nth-child(odd){transform:rotate(-4deg)}.roomcode span:nth-child(even){transform:rotate(3deg)}

/* play */
.task{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.task .what{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1;color:var(--gold);display:inline-flex;align-items:center;gap:10px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.task .what svg{width:34px;height:34px;flex:none}
.task .obj{font-family:var(--hand);font-weight:700;font-size:22px;color:var(--text)}
.squig{display:block;width:150px;height:10px;margin:2px auto 0}
.board{padding:0;overflow:hidden;background-color:var(--cream);
  background-image:linear-gradient(var(--pgrid) 1px,transparent 1px),linear-gradient(90deg,var(--pgrid) 1px,transparent 1px);background-size:20px 20px}
.board canvas{display:block;width:100%;touch-action:none;cursor:crosshair;position:relative;z-index:1}
.bhint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--hand);font-weight:700;font-size:20px;color:var(--ink-soft);pointer-events:none;z-index:3;transition:opacity .3s}
.ctrl{display:flex;justify-content:center;align-items:center;gap:14px}
.nudge{appearance:none;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);font-family:var(--display);font-weight:800;font-size:26px;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.nudge:active{background:var(--line)}
.nudge:disabled{opacity:.35}
.hurry{display:flex;flex-direction:column;gap:6px;padding:10px 16px 12px;background:var(--gold);text-align:center;transform:rotate(-.6deg)}
.hurry b{font-family:var(--hand);font-size:24px}
.hurry .hbar{height:12px;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--cream)}
.hurry .hbar i{display:block;height:100%;background:var(--ink);transition:width .25s linear}
.hurry.urgent{animation:shake .5s infinite}
.hurry.urgent .hbar i{background:var(--bad)}

/* duel */
.fighters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fighter{display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0}
.fighter .who{display:flex;align-items:center;gap:8px;min-width:0}
.fighter .who b{font-family:var(--display);font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fighter .blobw{position:relative;flex:none}
.blob{width:46px;height:auto;overflow:visible;display:block}
.blob.hit{animation:shake .5s 2}
.blob.win{animation:hop .45s 2}
.hp{height:16px;border-radius:999px;background:var(--mat);overflow:hidden;position:relative;border:1.5px solid var(--line)}
.hp i{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width 1s cubic-bezier(.4,1.6,.5,1);background-image:repeating-linear-gradient(-45deg,rgba(0,0,0,.14) 0 4px,transparent 4px 9px)}
.hpnum{font-size:13px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.dmg{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:32px;color:var(--bad);animation:float 1.6s forwards;pointer-events:none;white-space:nowrap;text-shadow:0 2px 0 #070C1A}
@keyframes float{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-5deg)}75%{transform:translateX(6px) rotate(5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard{padding:8px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0;opacity:0;animation:rise .5s cubic-bezier(.3,1.4,.5,1) forwards}
.rcard:nth-child(2){animation-delay:.15s}
.rcard canvas{width:100%;height:120px;display:block}
.rcard .nm{font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;max-width:100%}
.rcard .nm i{width:10px;height:10px;border-radius:50%;flex:none}
.rcard .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.split s{text-decoration:none;color:var(--ink-soft);font-weight:500;padding:0 3px}
.units{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.score{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.verdict{font-family:var(--hand);font-weight:700;font-size:19px;line-height:1.1}
@keyframes rise{from{opacity:0;transform:translateY(16px) rotate(1.5deg)}to{opacity:1}}
.banner{padding:14px 18px 16px;text-align:center;transform:rotate(-1deg)}
.banner h3{font-size:clamp(24px,6.5vw,32px)}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-4deg)}}
.pass{padding:34px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-height:46vh;justify-content:center}
.pass .blob{width:110px}
.waitblob{animation:hop 1.2s infinite}
.hist{display:flex;flex-direction:column;gap:8px;width:100%}
.hrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:15px;padding:8px 10px;border-radius:12px;background:rgba(27,26,46,.06);text-align:left}
.hrow b{font-family:var(--display)}
.hrow .e{font-variant-numeric:tabular-nums;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--ink);font-size:13px}
.confetti{position:relative;height:0}
.confetti i{position:absolute;width:14px;height:18px;border:2px solid var(--ink);border-radius:4px;top:0;animation:fall 2.6s ease-in forwards}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(420px) rotate(540deg);opacity:0}}
#net{appearance:none;cursor:pointer;position:fixed;z-index:20;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-family:var(--body);font-weight:700;font-size:14px;color:var(--text);
  padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.4);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#net::first-letter{color:var(--good)}
#net.lost::first-letter{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:calc(100vw - 32px);padding:12px 16px;text-align:center;font-weight:700}
.back{text-align:center;margin:26px 0 4px;font-size:15px}
.back a{color:var(--soft);text-underline-offset:4px}
@media (max-width:420px){.results{gap:8px}.rcard{padding:6px 6px 10px}.split{font-size:19px}.score{font-size:26px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main id="app" aria-live="polite"></main>
<p class="back"><a href="https://blacpapi24.github.io/Dapple/">‹ More games on Dapple</a></p>
<script>
(()=>{
'use strict';
/* ---------- small helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const backOut=t=>{t=clamp(t);const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);};
const elastic=t=>{t=clamp(t);return t===0||t===1?t:1-Math.pow(2,-9*t)*Math.cos(t*Math.PI*3.2);};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=(r,a,b)=>a+(b-a)*r();
const pickR=(r,a)=>a[Math.floor(r()*a.length)];
const capE=(v,e)=>v<e?Math.sqrt(Math.max(0,1-((e-v)/e)**2)):v>1-e?Math.sqrt(Math.max(0,1-((v-1+e)/e)**2)):1;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const INK='#1B1A2E';
const PCOL=['#FF7D6E','#56A6E2'];
const PV=['--p1','--p2'];

/* ---------- the things you split ----------
   Every object is a centre line (built from a heading that turns as you go along it), a half-width on each side,
   and a density. Mass along it is density x cross-section; round things use a circle, flat things a slab.
   The same seed rebuilds the exact same object on both phones. */
const N=240;
function mkF(flip){return flip?u=>1-u:u=>u;}
function bandsFor(F){const list=[];const B=(v0,v1,col)=>{const a=F(v0),b=F(v1);list.push([Math.min(a,b),Math.max(a,b),col]);};return [list,B];}
const KINDS={
  baguette:{name:'Baguette',measures:['weight','length'],gen(r){
    const L=R(r,52,72),t=R(r,2.7,3.5),lean=R(r,-.35,.35),bow=R(r,-.3,.3),tilt=R(r,-.08,.08),ph=R(r,0,6);
    return {L,head:u=>tilt+bow*(u-.5),wT:u=>t*(1+lean*(u-.5))*capE(u,.06)*(1+.035*Math.sin(u*38+ph)),rho:()=>.13,
      body:'#E2A651',inner:'#FBE7BF',core:'#F5D9A2',face:.5,
      decor(c,V){for(let k=1;k<=5;k++){const uc=k/6;strokeAlong(c,V,uc-.045,uc+.045,(u,q)=>-(.72-.62*q),V.at(uc).wT*.24,'rgba(255,240,205,.92)');}
        speckle(c,V,30,'rgba(140,80,20,.25)',V.G.seed+3,1.4);}};}},
  carrot:{name:'Carrot',measures:['weight','length'],gen(r){
    const L=R(r,15,25),t=R(r,1.35,1.9),flip=r()<.5,F=mkF(flip),tilt=R(r,-.1,.1),bow=R(r,-.25,.25),ex=R(r,.5,.95);
    const prof=v=>t*Math.pow(Math.max(0,1-v),ex)*(v<.07?Math.sqrt(Math.max(0,1-((.07-v)/.07)**2)):1)*(1+.04*Math.sin(v*31))+.06;
    return {L,head:u=>tilt+bow*(u-.5),wT:u=>prof(F(u)),rho:()=>1,body:'#F28A2E',inner:'#FCB45E',core:'#F9CF92',face:F(.27),padCm:{l:3,r:3},
      decor(c,V){for(let k=1;k<10;k++){const v=k/11;across(c,V,F(v),-.85,-.3,'rgba(150,60,0,.4)',1.8);across(c,V,F(v+.045),.25,.8,'rgba(150,60,0,.33)',1.8);}
        bandPoly(c,V,0,1,-.7,-.45,'rgba(255,220,170,.35)');},
      extras(c,V,a,b){const u0=F(0);if(u0<a-1e-6||u0>b+1e-6)return;leaves(c,V,u0,flip?1:-1);}};}},
  cucumber:{name:'Cucumber',measures:['weight','length'],gen(r){

function build(o){

  for(let i=0;i<N;i++){const u=i/(N-1);pts.push({u,x,y,wT:Math.max(0,S.wT(u)),wB:Math.max(0,wB(u)),rho:S.rho?S.rho(u):1});
    if(i<N-1){const tm=S.head(Math.min(1,u+.5/(N-1)));x+=Math.cos(tm)*ds;y+=Math.sin(tm)*ds;}}
  const area=p=>S.flat?(p.wT+p.wB)*(S.depth||1):Math.PI*((p.wT+p.wB)/2)**2*(S.xs||1);
  const cum={weight:[0],length:[0],volume:[0]};
  for(let i=1;i<N;i++){const a=pts[i-1],b=pts[i];cum.length.push(cum.length[i-1]+ds);
    cum.weight.push(cum.weight[i-1]+(area(a)*a.rho+area(b)*b.rho)/2*ds);cum.volume.push(cum.volume[i-1]+(area(a)+area(b))/2*ds);}
  let sx=0,sy=0;pts.forEach(p=>{sx+=p.x;sy+=p.y;});
  return Object.assign({},S,{kind:o.kind,seed:o.seed,name:S.name||K.name,pts,cum,sc:{x:sx/N,y:sy/N},total:{length:S.L,weight:cum.weight[N-1],volume:cum.volume[N-1]}});
}

const fmtCm=c=>c.toFixed(1)+' cm';
const fmtMl=m=>Math.round(m)+' ml';

    const d=B.c;d.clearRect(0,0,B.W,84);const sh=.36,ang=Math.sin(t*.0016)*.16,py=62;

/* ---------- two phones: the same pairing Hugh and Paddle Draft use ----------
   Phones find each other through PeerJS's free public broker, using the room code as the host's address.
   The room lives in one shared document that only the host's phone changes, and every phone keeps a copy
   in local storage, so a reload, a locked screen or a dropped connection never loses the game. The guest's own
   cuts are saved too and sent again until the host's copy shows them. A finished or closed game never
   traps anyone: reopening lands on the home screen with the room's options. */
const PEER_PREFIX='glasshalffull-q7m2-';
const peerOpts=()=>Object.assign({debug:0},window.GHF_PEER_SERVER||{});
const DEVICE=(()=>{let d=store.get('device','');if(!d){d='d'+Math.random().toString(36).slice(2,12);store.set('device',d);}return d;})();
const NET={peer:null,conn:null,host:false,code:null,active:false,rejoin:null,doc:null,intents:{},key:'',overSeen:''};
const LOBBY={opts:Object.assign({hp:100,hurry:20,what:'mix'},store.get('opts',{}))};
const ME=()=>NET.host?0:1;
const up=()=>!!(NET.conn&&NET.conn.open);
const saveDoc=()=>store.set('doc:'+NET.code,NET.doc);
const saveIntents=()=>store.set('intents:'+NET.code,NET.intents);
const netEl=document.createElement('button');netEl.id='net';netEl.type='button';netEl.hidden=true;document.body.insertBefore(netEl,app);
netEl.addEventListener('click',()=>{if(NET.active)home();});
function reconnectNow(){if(NET.host)hostRoom();else{clearTimeout(NET.rejoin);NET.rejoin=null;scheduleRejoin(0);}}
function netStatus(){
  if(!NET.active){netEl.hidden=true;document.body.classList.remove('online');return;}
  netEl.hidden=false;document.body.classList.add('online');netEl.classList.toggle('lost',!up());
  const them=NET.doc&&NET.doc.names[1-ME()];
  netEl.textContent=up()?`● Room ${NET.code} · with ${them||'partner'} · menu`:(NET.host&&!(NET.doc&&NET.doc.guest))?`● Room ${NET.code} · waiting for partner`:`● Room ${NET.code} · reconnecting… · menu`;
}
const libs={};
function loadScript(src){if(!libs[src])libs[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete libs[src];rej(new Error('load'));};document.head.appendChild(s);});return libs[src];}
const LETTERS='ABCDEFGHJKMNPQRSTUVWXYZ';
const newCode=()=>Array.from({length:4},()=>LETTERS[Math.floor(Math.random()*LETTERS.length)]).join('');
function raw(m,c=NET.conn){if(c&&c.open){try{c.send(JSON.stringify(m));}catch(e){}}}
function wireConn(conn){
  conn.on('open',()=>{if(!NET.host){NET.conn=conn;raw({t:'hello',id:DEVICE,name:store.get('me','')});Object.values(NET.intents).forEach(it=>raw({t:'intent',it}));}keepAwake();netStatus();});
  conn.on('data',d=>{let m;try{m=typeof d==='string'?JSON.parse(d):d;}catch(e){return;}if(m&&typeof m==='object')(NET.host?hostGot:guestGot)(conn,m);});
  conn.on('close',()=>{if(NET.conn===conn){NET.conn=null;netStatus();renderOnline();scheduleRejoin();}});
  conn.on('error',()=>{});
}
async function hostRoom(){
  if(!NET.active||!NET.host)return;
  try{await loadScript('vendor/peerjs.min.js');}catch(e){netEl.textContent='● Couldn\'t load the connection code. Tap to retry.';netEl.classList.add('lost');return;}
  if(!NET.active||!NET.host)return;
  if(NET.peer&&!NET.peer.destroyed&&NET.peer.open)return;
  if(NET.peer){try{NET.peer.destroy();}catch(e){}}
  const p=new Peer(PEER_PREFIX+NET.code,peerOpts());NET.peer=p;
  p.on('open',()=>netStatus());
  p.on('connection',conn=>wireConn(conn));
  p.on('disconnected',()=>setTimeout(()=>{if(NET.peer===p&&!p.destroyed){try{p.reconnect();}catch(e){}}},3000));
  p.on('error',e=>{if(NET.peer!==p||e.type==='peer-unavailable')return;setTimeout(()=>{if(NET.peer===p&&NET.active){try{p.destroy();}catch(x){}NET.peer=null;hostRoom();}},4000);});
}
function joinPeer(code){
  return loadScript('vendor/peerjs.min.js').then(()=>new Promise(res=>{
    if(NET.peer){try{NET.peer.destroy();}catch(e){}}
    const p=new Peer(peerOpts());NET.peer=p;let done=false;
    const fin=msg=>{if(done)return;done=true;clearTimeout(t);if(msg){try{p.destroy();}catch(e){}if(NET.peer===p)NET.peer=null;}res(msg||null);};
    const t=setTimeout(()=>fin(`Couldn't reach room ${code}. Check the code, and ask your partner to keep Glass Half Full open on their screen.`),20000);
    p.on('error',e=>fin(e.type==='peer-unavailable'?`Can't find room ${code}. Check the code, and ask your partner to keep Glass Half Full open on their screen.`:'Couldn\'t connect. Check your internet and try again.'));
    p.on('open',()=>{const conn=p.connect(PEER_PREFIX+code,{serialization:'raw',reliable:true});wireConn(conn);conn.on('open',()=>fin(null));});
  }),()=>'Couldn\'t load the connection code. Check your internet and try again.');
}
function scheduleRejoin(ms=2500){
  if(NET.host||!NET.active||NET.rejoin||up())return;
  NET.rejoin=setTimeout(async()=>{const err=await joinPeer(NET.code);NET.rejoin=null;NET.fails=err?(NET.fails||0)+1:0;netStatus();renderOnline();if(err&&NET.active&&!up())scheduleRejoin();},ms);
}
let wake=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!NET.active)return;keepAwake();
  if(NET.host){if(!NET.peer||NET.peer.destroyed)hostRoom();else if(NET.peer.disconnected){try{NET.peer.reconnect();}catch(e){}}}
  else if(!up())scheduleRejoin(0);
});
setInterval(()=>{if(document.visibilityState!=='visible'||!NET.active)return;if(NET.host){if(!NET.peer||NET.peer.destroyed)hostRoom();}else if(!up())scheduleRejoin();},6000);
function hostGot(conn,m){
  const d=NET.doc;if(!d)return;
  if(m.t==='hello'){
    if(d.guest&&d.guest!==m.id){raw({t:'full'},conn);setTimeout(()=>{try{conn.close();}catch(e){}},300);return;}
    if(NET.conn&&NET.conn!==conn){const old=NET.conn;NET.conn=null;try{old.close();}catch(e){}}
    NET.conn=conn;conn.guestId=m.id;
    if(!d.guest||d.names[1]!==String(m.name||'').slice(0,18)){d.guest=m.id;d.names[1]=String(m.name||'Partner').slice(0,18)||'Partner';commit();}
    else raw({t:'doc',doc:d});
    netStatus();return;
  }
  if(conn!==NET.conn||conn.guestId!==d.guest)return;
  if(m.t==='intent'&&m.it)apply(1,m.it);
}
function commit(){NET.doc.v++;saveDoc();raw({t:'doc',doc:NET.doc});netStatus();renderOnline();}
function newGame(o){
  const hp=[60,100,160].includes(+o.hp)?+o.hp:100,what=['mix','weight','length'].includes(o.what)?o.what:'mix';
  return {gid:Math.random().toString(36).slice(2,10),what,hurry:[0,10,20,30].includes(+o.hurry)?+o.hurry:20,max:hp,hp:[hp,hp],hpBefore:[hp,hp],round:1,obj:newObj(what,null),picks:[null,null],revealed:false,ready:[false,false],history:[],over:false};
}
const okS=s=>typeof s==='number'&&isFinite(s)&&s>=0&&s<=1;
function apply(seat,it){
  const d=NET.doc,g=d.game;if(!it||typeof it!=='object')return;
  if(it.k==='start'&&seat===0&&d.guest){d.game=newGame(it.opts||{});return commit();}
  if(it.k==='leave'&&seat===1){d.guest=null;d.names[1]='';d.game=null;return commit();}
  if(it.k==='lobby'&&g&&(seat===0||g.over)){d.game=null;return commit();}
  if(!g||it.gid!==g.gid)return;
  if(it.k==='pick'&&it.round===g.round&&!g.revealed&&g.picks[seat]==null&&okS(it.s)){
    g.picks[seat]=it.s;
    if(g.picks[0]!=null&&g.picks[1]!=null){const o=duelOutcome(g.obj,g.picks,g.round);
      g.hpBefore=g.hp.slice();if(o.win>=0)g.hp[1-o.win]-=o.dmg;g.history.push(hist(g.obj,g.picks,o));g.revealed=true;g.over=g.hp.some(h=>h<=0);}
    return commit();
  }
  if(it.k==='ready'&&it.round===g.round&&g.revealed&&!g.over&&!g.ready[seat]){
    g.ready[seat]=true;
    if(g.ready[0]&&g.ready[1]){g.round++;g.obj=newObj(g.what,g.obj.kind);g.picks=[null,null];g.revealed=false;g.ready=[false,false];g.hpBefore=g.hp.slice();}
    return commit();
  }
}
function guestGot(conn,m){
  if(m.t==='doc'&&m.doc&&Array.isArray(m.doc.names)){
    if(!NET.doc||m.doc.v>=NET.doc.v||m.doc.code!==NET.doc.code){NET.doc=m.doc;saveDoc();pruneIntents();netStatus();renderOnline();}
    if(NET.joinWait){const w=NET.joinWait;NET.joinWait=null;w();}
  }
  else if(m.t==='full'){if(NET.joinWait){const w=NET.joinWait;NET.joinWait=null;w('That room already has two players.');}}
  else if(m.t==='closed'){const who=NET.doc&&NET.doc.names[0]||'Your partner';clearRoom();home();toast(`${who} closed the room.`);}
}
function pruneIntents(){
  const g=NET.doc.game;let ch=false;
  for(const k of Object.keys(NET.intents)){const it=NET.intents[k];
    if(k==='start'||k==='leave'||!g||it.gid!==g.gid){if(k!=='leave'){delete NET.intents[k];ch=true;}continue;}
    if(it.round<g.round||(k==='pick'&&g.picks[1]!=null)){delete NET.intents[k];ch=true;}
  }
  if(ch)saveIntents();
}
function act(it){NET.away=false;if(NET.host){apply(0,it);return;}NET.intents[it.k]=it;saveIntents();raw({t:'intent',it});renderOnline();}
const pending=k=>{const it=NET.intents[k],g=NET.doc&&NET.doc.game;return it&&g&&it.gid===g.gid?it:null;};
function setRoom(code,host){NET.away=false;NET.code=code;NET.host=host;NET.active=true;NET.key='';NET.fails=0;store.set('room',{code,host});NET.intents=store.get('intents:'+code,{});}
function clearRoom(){
  const c=NET.conn,p=NET.peer,code=NET.code;NET.conn=null;NET.peer=null;NET.active=false;clearTimeout(NET.rejoin);NET.rejoin=null;
  NET.doc=null;NET.intents={};NET.key='';store.set('room',null);if(code){store.set('doc:'+code,null);store.set('intents:'+code,null);}
  setTimeout(()=>{try{c&&c.close();}catch(e){}try{p&&p.destroy();}catch(e){}},300);netStatus();
}
function leaveRoom(){if(NET.host)raw({t:'closed'});else raw({t:'intent',it:{k:'leave'}});clearRoom();home();}
function bootOnline(){
  const r=store.get('room',null);if(!r||!r.code)return false;
  setRoom(r.code,!!r.host);NET.doc=store.get('doc:'+r.code,null);
  if(NET.host&&!NET.doc){clearRoom();return false;}
  netStatus();
  if(NET.doc&&NET.doc.game&&NET.doc.game.over){NET.away=true;home();}else renderOnline();
  if(NET.host)hostRoom();else scheduleRejoin(0);
  return true;
}
function roomName(host,err=''){
  show(`<h2>${host?'Start a room':'Join a room'}</h2><section class="card stack" style="gap:14px">
    <label class="f">Your name<input type="text" id="me" maxlength="18" placeholder="Your name" autocomplete="nickname" value="${esc(store.get('me',''))}"></label>
    ${host?'<p class="hint">You get a four-letter code to give your partner.</p>':'<label class="f">Room code<input type="text" class="code" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD"></label>'}
    <p class="err" id="err">${err}</p>
    <div class="row"><button class="btn" id="go">${host?'Open the room':'Join'}</button><button class="link" id="back">Back</button></div></section>`);
  on('#back','click',home);
  on('#go','click',async()=>{
    const me=app.querySelector('#me').value.trim(),e=app.querySelector('#err');
    if(!me){e.textContent='Add your name so your partner knows who they are playing.';return;}
    store.set('me',me);
    if(NET.active)leaveRoom();
    if(host){const code=newCode();setRoom(code,true);NET.doc={v:1,code,names:[me,''],guest:null,game:null};saveDoc();netStatus();renderOnline();hostRoom();return;}
    const code=app.querySelector('#code').value.toUpperCase().replace(/[^A-Z]/g,'');
    if(code.length!==4){e.textContent='Room codes are 4 letters.';return;}
    const b=app.querySelector('#go');b.disabled=true;b.textContent='Joining…';e.textContent='';
    setRoom(code,false);NET.doc=null;
    let msg=await joinPeer(code);
    if(!msg)msg=await new Promise(res=>{NET.joinWait=res;setTimeout(()=>{if(NET.joinWait===res){NET.joinWait=null;res('The room didn\'t answer. Try again.');}},10000);});
    if(msg){clearRoom();b.disabled=false;b.textContent='Join';e.textContent=msg;return;}
    keepAwake();netStatus();renderOnline();
  });
}
function onlineRematch(){act({k:'start',opts:LOBBY.opts});}
function backToRoom(){if(!NET.host&&!up())toast('Can\'t reach the room right now. It\'ll pass it on when it reconnects.');act({k:'lobby',gid:NET.doc&&NET.doc.game&&NET.doc.game.gid});}
function renderOnline(){
  if(!NET.active)return;
  const d=NET.doc,me=ME(),them=1-me;let key,draw,post=null;
  if(!NET.host&&!up()&&(NET.fails||0)>=2){const hn=esc(d&&d.names[0]||'your partner');key='gone';draw=()=>{show(`<section class="sticker ink pass pop">${blobSVG('--p2','sad')}<h2>Can't reach ${hn}'s room</h2>
      <p class="muted">${hn}'s phone may have closed the game, or the room was closed. It keeps trying in the background and carries on as soon as it gets through.</p>
      <div class="row c"><button class="btn" id="retry">Try again now</button><button class="btn ghost" id="leave">Leave the room</button></div><button class="link" id="home">Home</button></section>`);
    on('#retry','click',reconnectNow);on('#leave','click',leaveRoom);on('#home','click',home);};}
  else if(!d){key='connecting';draw=()=>waitScreen(`Joining room ${esc(NET.code)}…`);}
  else if(!NET.host&&d.guest&&d.guest!==DEVICE){key='full';draw=()=>{show(`<section class="sticker ink pass">${blobSVG('--p2','sad')}<h2>That room is full</h2><p class="muted">Someone else is playing ${esc(d.names[0])} in room ${esc(NET.code)}.</p><button class="btn" id="leave">OK</button></section>`);on('#leave','click',leaveRoom);};}
  else if(!d.game){key=`lobby|${d.names.join('|')}|${!!d.guest}|${up()}`;draw=lobby;}
  else{
    const g=d.game,nm=d.names.map(esc),pp=pending('pick'),pr=pending('ready');
    const myPick=g.picks[me]!=null?g.picks[me]:(pp&&pp.round===g.round?pp.s:null);
    const myReady=g.ready[me]||(pr&&pr.round===g.round);
    if(g.revealed&&g.over&&NET.overSeen===g.gid){key=`over|${g.gid}|${d.v}`;draw=()=>duelOver({names:d.names,hp:g.hp,round:g.round,history:g.history,again:NET.host?onlineRematch:null,room:backToRoom});}
    else if(g.revealed&&myReady){key=`ready|${g.gid}|${g.round}`;draw=()=>waitScreen(`Waiting for ${nm[them]} to be ready…`);}
    else if(g.revealed){key=`rev|${g.gid}|${g.round}`;draw=()=>revealScreen({obj:g.obj,picks:g.picks,names:d.names,hp:g.hpBefore.slice(),max:g.max,round:g.round,next:over=>onlineNext(g.round,over)});}
    else if(myPick!=null){key=`lock|${g.gid}|${g.round}`;draw=()=>waitScreen(`Cut! Waiting for ${nm[them]}…`,{obj:g.obj,s:myPick});}
    else{key=`cut|${g.gid}|${g.round}`;
      if(g.hurry&&g.picks[them]!=null)post=()=>{const hk='hurry:'+g.gid+':'+g.round;let dl=store.get(hk,0);if(!dl){dl=Date.now()+g.hurry*1000;store.set(hk,dl);}NET.cutCtl&&NET.cutCtl.hurry(dl,d.names[them]);};
      draw=()=>NET.cutCtl=cutScreen({who:d.names[me],colVar:PV[me],top:`Round ${g.round} · ×${mult(g.round)}`,obj:g.obj,onLock:s=>act({k:'pick',gid:g.gid,round:g.round,s})});}
  }
  if(NET.away)return;
  if(key!==NET.key){NET.cutCtl=null;NET.key=key;draw();}
  if(post)post();
}
function onlineNext(r,over){const g=NET.doc&&NET.doc.game;if(!g)return;if(over){NET.overSeen=g.gid;renderOnline();return;}act({k:'ready',gid:g.gid,round:r});}
function lobby(){
  const d=NET.doc,o=LOBBY.opts,live=up();
  if(NET.host){
    show(`<h2 class="center">Your room</h2><div class="roomcode" aria-label="Room code ${NET.code}">${[...NET.code].map(c=>`<span>${c}</span>`).join('')}</div>
      <p class="center muted">Your partner opens Glass Half Full on their phone, taps <b>Join a room</b> and types this code.</p>
      <div class="row c">${d.guest?`${blobSVG('--p2',live?'love':'meh')}<h3>${esc(d.names[1])} ${live?'is here!':'is reconnecting…'}</h3>`:`${blobSVG('--p2','meh','waitblob')}<h3 class="muted">Waiting for your partner…</h3>`}</div>
      <section class="card stack" style="gap:16px">${optsHTML(o)}<div class="row"><button class="btn" id="start" ${d.guest?'':'disabled'}>Start on both phones</button></div></section>
      <div class="row c"><button class="link" id="leave">Close the room</button><button class="link" id="home">Home</button></div>`);
    bindOpts(o,()=>store.set('opts',o));on('#start','click',onlineRematch);
  }else{
    show(`<section class="sticker ink pass pop">${blobSVG('--p2','happy','waitblob')}<h2>You're in room ${esc(NET.code)}</h2>
      <p class="muted">${esc(d.names[0])} picks the rules. The duel starts on both phones at once.</p>
      <div class="row c"><button class="link" id="leave">Leave the room</button><button class="link" id="home">Home</button></div></section>`);
  }
  on('#leave','click',leaveRoom);on('#home','click',home);
}
function waitScreen(text,cut){
  show(`<section class="sticker ink pass pop">${cut?'<div class="board" style="width:100%;border-radius:14px"><canvas id="wcv"></canvas></div>':blobSVG(PV[ME()],'happy','waitblob')}<h2>${text}</h2>
    <p class="muted">Keep the game open. It moves on by itself, and picks up where it left off if you close it.</p><button class="link" id="wmenu">Room menu</button></section>`);
  if(cut)stillBoard(app.querySelector('#wcv'),cut.obj,cut.s,PCOL[ME()],170);
  on('#wmenu','click',home);
}
const homeBase=home;
home=function(){homeBase();if(!NET.active)return;NET.away=true;const box=app.querySelector('.online-box');
  box.innerHTML=`<h3>You're in room ${esc(NET.code)}</h3>
    ${up()?'':`<p class="muted">Not connected to ${esc(NET.doc&&NET.doc.names[1-ME()]||'your partner')} right now.</p>`}<div class="row"><button class="btn" id="toroom">Back to the game</button>${up()?'':'<button class="btn ghost" id="recon">Reconnect</button>'}${NET.host&&NET.doc&&NET.doc.game?'<button class="btn ghost" id="endg">End this game</button>':''}<button class="btn ghost" id="leave">${NET.host?'Close the room':'Leave the room'}</button></div>`;
  on('#recon','click',()=>{reconnectNow();toast('Reconnecting…');});
  on('#endg','click',()=>{NET.away=false;backToRoom();});
  on('#toroom','click',()=>{NET.away=false;NET.key='';const g=NET.doc&&NET.doc.game;if(g&&g.over)NET.overSeen=g.gid;renderOnline();});on('#leave','click',leaveRoom);};

window.__ghf={KINDS,build,shareAt,halfAt,judgeCut,newObj,cutScreen,revealScreen,duelOver};
bootOnline()||home();
})();
</script>
